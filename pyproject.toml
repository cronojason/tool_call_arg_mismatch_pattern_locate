[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronojason-tool_call_arg_mismatch_pattern_locate"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告模型压缩工程师·工具调用的参数错配相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cronojason" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cronojason.github.io"
Repository = "https://github.com/cronojason/tool_call_arg_mismatch_pattern_locate"
Issues = "https://github.com/cronojason/tool_call_arg_mismatch_pattern_locate/issues"

[project.scripts]
tool_call_arg_mismatch_pattern_locate = "tool_call_arg_mismatch_pattern_locate:main"

[tool.setuptools]
py-modules = ["tool_call_arg_mismatch_pattern_locate"]
